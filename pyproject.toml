[tool.ruff.lint]
select = ["E", "F", "BLE", "S"]
ignore = [
    "E501",  # line length — prompts.py has long descriptive lines by design
    "E402",  # graph.py calls load_dotenv() before other imports on purpose
]

[tool.ruff.lint.per-file-ignores]
"agent/nodes/*.py" = ["BLE001"]      # nodes catch broad exceptions on purpose, to degrade gracefully instead of crashing the graph
"agent/sandbox.py" = ["S102"]  # restricted builtins, tested (test_sandbox.py), not a full sandbox
"agent/nodes/predict_calories.py" = ["S301"]  # pickle files are self-generated by train_model.py, not untrusted input
"app.py" = ["BLE001"]
"tests/*.py" = ["S101"]  # assert is how pytest tests work
